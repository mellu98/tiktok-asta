[package]
name = "android-device-control"
version = "0.2.0"
description = "POC controllo dispositivi Android da macOS — ADB + scrcpy + dashboard"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"

[profile.release]
strip = true
lto = true
